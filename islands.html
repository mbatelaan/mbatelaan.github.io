---
layout: fullwidth
title: Islands
---

<style>
#map-cv { display: block; cursor: crosshair; }
</style>

<canvas id="map-cv"></canvas>

<script>
(function () {
'use strict';

const cv = document.getElementById('map-cv');
const g  = cv.getContext('2d');

const TOP = cv.getBoundingClientRect().top;
cv.width  = window.innerWidth;
cv.height = Math.floor(window.innerHeight - TOP - 1);
const W = cv.width, H = cv.height;

const TILE = 8;
const COLS = Math.floor(W / TILE);
const ROWS = Math.floor(H / TILE);

/* ── tile types & colours (water = site bg #ffd) ── */
const T_WATER = 0, T_SHALLOW = 1, T_SAND = 2, T_LAND = 3;
const TCOLOUR = ['#ffffdd', '#ece8b8', '#c8a040', '#4a7030'];

/* ── hash noise ── */
function h2(x, y) {
  let n = Math.imul(x, 374761393) ^ Math.imul(y, 1073741789);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return (n >>> 0) / 4294967296;
}
function bilerp(x, y, s) {
  const ix = Math.floor(x / s), iy = Math.floor(y / s);
  const fx = x / s - ix, fy = y / s - iy;
  return h2(ix,iy)*(1-fx)*(1-fy) + h2(ix+1,iy)*fx*(1-fy)
       + h2(ix,iy+1)*(1-fx)*fy   + h2(ix+1,iy+1)*fx*fy;
}

/* ── islands ── */
const ISLS = [
  { cx:.16, cy:.50, rx:24, ry:8,  a:.30  },
  { cx:.40, cy:.30, rx:14, ry:5,  a:-.18 },
  { cx:.55, cy:.68, rx:9,  ry:4,  a:.50  },
  { cx:.68, cy:.36, rx:10, ry:4,  a:.12  },
  { cx:.74, cy:.70, rx:5,  ry:3,  a:.80  },
  { cx:.83, cy:.22, rx:8,  ry:3,  a:-.40 },
  { cx:.87, cy:.76, rx:4,  ry:2,  a:.30  },
  { cx:.12, cy:.76, rx:7,  ry:4,  a:.40  },
  { cx:.35, cy:.82, rx:4,  ry:2,  a:0    },
  { cx:.60, cy:.15, rx:4,  ry:2,  a:0    },
  { cx:.91, cy:.54, rx:6,  ry:2,  a:.60  },
  { cx:.28, cy:.18, rx:5,  ry:3,  a:.10  },
];

function cellType(tx, ty) {
  let minD = Infinity;
  for (const isl of ISLS) {
    const cx = isl.cx * COLS, cy = isl.cy * ROWS;
    const dx = tx - cx, dy = ty - cy;
    const ca = Math.cos(-isl.a), sa = Math.sin(-isl.a);
    const lx = (dx*ca - dy*sa) / isl.rx;
    const ly = (dx*sa + dy*ca) / isl.ry;
    const d  = Math.sqrt(lx*lx + ly*ly);
    if (d < minD) minD = d;
  }
  const n = bilerp(tx, ty, 3)*0.22 + bilerp(tx, ty, 9)*0.08;
  const d = minD - n;
  if (d < 0.55) return T_LAND;
  if (d < 0.82) return T_SAND;
  if (d < 1.28) return T_SHALLOW;
  return T_WATER;
}

/* ── build tile map ── */
const tileMap = new Uint8Array(COLS * ROWS);
for (let ty = 0; ty < ROWS; ty++)
  for (let tx = 0; tx < COLS; tx++)
    tileMap[ty * COLS + tx] = cellType(tx, ty);

/* ── pixel-art island decorations ── */
function drawArt(ctx, art, colors, x, y, S) {
  art.forEach((row, ry) => {
    for (let rx = 0; rx < row.length; rx++) {
      const c = colors[row[rx]];
      if (!c) continue;
      ctx.fillStyle = c;
      ctx.fillRect(x + rx * S, y + ry * S, S, S);
    }
  });
}

// palm tree: 9 wide × 10 tall, S=2 → 18×20px
const PALM = [
  '....L....',
  '...LLL...',
  '..LLLLL..',
  '.LLLLLLL.',
  '....T....',
  '....T....',
  '...TTT...',
  '....T....',
  '....T....',
  '...TTT...',
];
const PALM_C = { L:'#2e6020', T:'#7a4018' };

// house: 9 wide × 8 tall, S=2 → 18×16px
const HOUSE = [
  '....R....',
  '...RRR...',
  '..RRRRR..',
  '.RRRRRRR.',
  'WWWWWWWWW',
  'WWDWWWWWW',
  'WWDWWWWWW',
  'WWWWWWWWW',
];
const HOUSE_C = { R:'#6a3820', W:'#d4c870', D:'#282010' };

function findLandNear(cx, cy) {
  for (let r = 0; r <= 18; r++) {
    for (let dx = -r; dx <= r; dx++) {
      for (let dy = -r; dy <= r; dy++) {
        if (Math.abs(dx) !== r && Math.abs(dy) !== r) continue;
        const tx = cx + dx, ty = cy + dy;
        if (tx >= 0 && tx < COLS && ty >= 0 && ty < ROWS)
          if (tileMap[ty * COLS + tx] === T_LAND) return [tx, ty];
      }
    }
  }
  return null;
}

/* ── pre-render background ── */
const bgCv  = document.createElement('canvas');
bgCv.width  = W; bgCv.height = H;
const bgCtx = bgCv.getContext('2d');

for (let ty = 0; ty < ROWS; ty++) {
  for (let tx = 0; tx < COLS; tx++) {
    const t  = tileMap[ty * COLS + tx];
    const px = tx * TILE, py = ty * TILE;
    bgCtx.fillStyle = TCOLOUR[t];
    bgCtx.fillRect(px, py, TILE, TILE);
    // subtle ripple marks on shallow water
    if (t === T_SHALLOW && h2(tx*7+3, ty*11+1) < 0.10) {
      bgCtx.fillStyle = '#d8d4a8';
      bgCtx.fillRect(px+1, py+4, 5, 1);
    }
  }
}

// draw decorations on each island
ISLS.forEach((isl, i) => {
  if (isl.rx < 4) return;
  const icx = Math.round(isl.cx * COLS), icy = Math.round(isl.cy * ROWS);
  const useHouse = (isl.rx >= 12 && i % 3 === 0) || (i === 5);

  // for large islands place two decorations spread along the long axis
  const offsets = isl.rx >= 15
    ? [[-Math.round(isl.rx*0.35), 0], [Math.round(isl.rx*0.35), 0]]
    : [[0, 0]];

  offsets.forEach(([ox, oy], di) => {
    const spot = findLandNear(icx + ox, icy + oy);
    if (!spot) return;
    const [tx, ty] = spot;
    const px = tx * TILE + 4 - 9;   // center 18px art on tile
    const py = ty * TILE + TILE;     // bottom of tile
    if (di === 0 && useHouse) {
      drawArt(bgCtx, HOUSE, HOUSE_C, px, py - 16, 2);  // 16px tall
    } else {
      drawArt(bgCtx, PALM,  PALM_C,  px, py - 20, 2);  // 20px tall
    }
  });
});

/* ── boat ── */
let sx = TILE * 4, sy = Math.floor(H / 2);
outer: for (let ty2 = Math.floor(ROWS/2)-8; ty2 < Math.floor(ROWS/2)+8; ty2++) {
  for (let tx2 = 2; tx2 < 30; tx2++) {
    if (tileMap[ty2 * COLS + tx2] === T_WATER) {
      sx = tx2 * TILE + 4; sy = ty2 * TILE + 4; break outer;
    }
  }
}

const boat = { x: sx, y: sy };
let boatFacing = 1; // 1=right, -1=left
const SPEED = 1.8;
let mx = sx + 1, my = sy;
const wake = [];

cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  mx = e.clientX - r.left; my = e.clientY - r.top;
});
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = cv.getBoundingClientRect();
  mx = e.touches[0].clientX - r.left; my = e.touches[0].clientY - r.top;
}, { passive: false });

function tileAt(px, py) {
  const tx = Math.floor(px / TILE), ty = Math.floor(py / TILE);
  if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) return T_WATER;
  return tileMap[ty * COLS + tx];
}

function canSail(nx, ny) {
  return tileAt(nx,    ny)   <= T_SHALLOW &&
         tileAt(nx+12, ny)   <= T_SHALLOW &&
         tileAt(nx-12, ny)   <= T_SHALLOW &&
         tileAt(nx,    ny+8) <= T_SHALLOW &&
         tileAt(nx,    ny-8) <= T_SHALLOW;
}

function update() {
  const dx = mx - boat.x, dy = my - boat.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  if (dist < 5) return;
  const angle = Math.atan2(dy, dx);
  if (Math.abs(Math.cos(angle)) > 0.12) boatFacing = Math.cos(angle) > 0 ? 1 : -1;
  const nx = boat.x + Math.cos(angle) * SPEED;
  const ny = boat.y + Math.sin(angle) * SPEED;
  if (canSail(nx, ny)) {
    wake.push({ x: boat.x, y: boat.y, a: 1.0 });
    if (wake.length > 18) wake.shift();
    boat.x = nx; boat.y = ny;
  }
}

/* ── pixel-art pirate ship (1700s, side view, bow = right) ── */
function drawBoat() {
  const bx = Math.round(boat.x), by = Math.round(boat.y);

  // wake trail
  wake.forEach((pt, i) => {
    const a = (i / wake.length) * 0.3;
    g.save();
    g.globalAlpha = a;
    g.fillStyle = '#d8d4a8';
    g.fillRect(pt.x-3, pt.y,   6, 1);
    g.fillRect(pt.x-5, pt.y+2, 10, 1);
    g.restore();
  });

  g.save();
  g.translate(bx, by);
  if (boatFacing === -1) g.scale(-1, 1);

  const P = 3;
  // r(x,y,w,h,c) — all units in "art pixels" × P
  const r = (x,y,w,h,c) => { g.fillStyle=c; g.fillRect(x*P,y*P,w*P,h*P); };

  // ── bowsprit (diagonal up-right from bow, 5 pixels) ──
  for (let i=0; i<5; i++) r(10+i, -1-i, 1, 1, '#1a1008');

  // ── masts ──
  r(-8, -20, 1, 21, '#1a1008');  // main mast
  r( 5, -13, 1, 14, '#1a1008');  // fore mast

  // ── yard arms (horizontal beams sails hang from) ──
  r(-13, -14, 11, 1, '#1a1008'); // main lower yard
  r(-12, -19,  9, 1, '#1a1008'); // main upper yard
  r(  1, -13,  9, 1, '#1a1008'); // fore yard

  // ── sails (cream with darker fold lines) ──
  const SC = '#edeadb', SF = '#ccc8b2';

  // main topsail
  r(-12, -18, 9, 4, SC);
  r( -8, -18, 1, 4, SF);  // mast
  r(-10, -18, 1, 4, SF);  // fold

  // main sail (large square, dominant feature)
  r(-13, -13, 11, 10, SC);
  r( -8, -13,  1, 10, SF);  // mast through sail
  r(-11, -13,  1, 10, SF);  // fold line
  r( -5, -13,  1, 10, SF);  // fold line

  // fore topsail
  r(1, -12, 9, 3, SC);
  r(5, -12, 1, 3, SF);

  // fore sail
  r(1, -9, 9, 8, SC);
  r(5, -9, 1, 8, SF);
  r(3, -9, 1, 8, SF);
  r(7, -9, 1, 8, SF);

  // jib (triangle from foremast tip to bowsprit, stepping down)
  r(6,-9,3,1,SC); r(6,-8,3,1,SC); r(7,-7,3,1,SC);
  r(7,-6,3,1,SC); r(8,-5,2,1,SC); r(8,-4,2,1,SC);
  r(9,-3,1,1,SC); r(9,-2,1,1,SC);

  // ── Jolly Roger (black flag at mainmast top) ──
  r(-8, -23, 6, 3, '#080808');
  // tiny skull: two white eye-dots
  r(-6, -22, 1, 1, '#d8d8b0');
  r(-5, -22, 1, 1, '#d8d8b0');

  // ── stern castle (raised aft section) ──
  r(-17, -6, 3, 6, '#6e5420');
  r(-17, -6, 3, 1, '#9a7840'); // stern rail

  // ── deck ──
  r(-15, -2, 29, 2, '#6e5420');
  r(-15, -2, 29, 1, '#9a7840'); // deck rail

  // ── hull ──
  r(-15,  0, 29, 1, '#881818'); // red stripe (gun deck marker)
  r(-15,  1, 29, 6, '#140c04'); // main hull body
  r(-15,  1, 29, 1, '#221008'); // top highlight

  // gun ports (5 dark squares in hull)
  for (const gx of [-12, -7, -2, 3, 8]) r(gx, 2, 2, 3, '#050302');

  // hull tapering toward keel
  r(-13,  7, 26, 3, '#140c04');
  r(-11, 10, 22, 2, '#140c04');
  r( -9, 12, 18, 1, '#140c04');

  g.restore();
}

/* ── loop ── */
function loop() {
  update();
  g.drawImage(bgCv, 0, 0);
  drawBoat();
  requestAnimationFrame(loop);
}
loop();

}());
</script>
